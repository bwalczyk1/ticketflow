map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;

    # Containers get a new IP on restart. Variables make nginx resolve the names per request
    # through the Docker DNS, instead of keeping the addresses found at startup.
    resolver 127.0.0.11 valid=10s;
    set $php_upstream app:9000;
    set $vite_upstream frontend:5173;

    root /var/www/html/public;
    client_max_body_size 10m;

    location ~ ^/(api|sanctum|docs|horizon|vendor|up)(/|$) {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 60s;
    }

    location / {
        proxy_pass http://$vite_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
